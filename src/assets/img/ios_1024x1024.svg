<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <style>
      .p1{animation:p 2s ease-out infinite;transform-origin:512.0px 634.88px;}
      .p2{animation:p 2s ease-out 0.55s infinite;transform-origin:512.0px 634.88px;}
      .p3{animation:p 2s ease-out 1.1s infinite;transform-origin:512.0px 634.88px;}
      .dl{animation:dm 1.8s linear infinite;}
      .dr{animation:dm 1.8s linear 0.6s infinite;}
      @keyframes p{
        0%{opacity:0;transform:scale(0.82);}
        28%{opacity:0.55;}
        100%{opacity:0;transform:scale(1.22);}
      }
      @keyframes dm{
        0%{stroke-dashoffset:634.88;opacity:1;}
        100%{stroke-dashoffset:0;opacity:0.12;}
      }
    </style></defs>
