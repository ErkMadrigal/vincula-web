  <polyline class="dl" points="512.0,634.88 225.27999999999997,163.84" fill="none" stroke="#7B5EA7" stroke-width="38.912" stroke-dasharray="56.32 38.912" stroke-dashoffset="634.88" stroke-linecap="round"/>
  <polyline class="dr" points="512.0,634.88 798.72,163.84" fill="none" stroke="#9B7FDB" stroke-width="38.912" stroke-dasharray="56.32 38.912" stroke-dashoffset="634.88" stroke-linecap="round"/>
