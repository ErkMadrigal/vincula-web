<svg xmlns="http://www.w3.org/2000/svg" width="512" height="300" viewBox="0 90 512 300">
  <defs>
    <style>
      .pulse1 { animation: pulse 2s ease-out infinite; transform-origin: 256px 230px; }
      .pulse2 { animation: pulse 2s ease-out 0.5s infinite; transform-origin: 256px 230px; }
      .pulse3 { animation: pulse 2s ease-out 1s infinite; transform-origin: 256px 230px; }
      .dash-l { animation: dashMove 1.8s linear infinite; }
      .dash-r { animation: dashMove 1.8s linear 0.6s infinite; }
      .wm     { font-family: Arial, sans-serif; font-size: 72px; font-weight: 500; letter-spacing: 12px; fill: #1E1252; }
      .wm-v   { font-family: Arial, sans-serif; font-size: 72px; font-weight: 500; letter-spacing: 12px; fill: #6B4FBB; }
      .tag    { font-family: Arial, sans-serif; font-size: 16px; font-weight: 400; letter-spacing: 4px; fill: #9B89D4; }
      @keyframes pulse {
        0%   { opacity: 0; transform: scale(0.85); }
        30%  { opacity: 0.5; }
        100% { opacity: 0; transform: scale(1.15); }
      }
      @keyframes dashMove {
        0%   { stroke-dashoffset: 120; opacity: 1; }
        100% { stroke-dashoffset: 0;   opacity: 0.2; }
      }
    </style>
  </defs>

  <rect width="512" height="512" fill="none"/>

  <!-- Pulse rings -->
  <circle class="pulse1" cx="256" cy="230" r="36" fill="none" stroke="#6B4FBB" stroke-width="1.8"/>
  <circle class="pulse2" cx="256" cy="230" r="54" fill="none" stroke="#8B6FDB" stroke-width="1.3"/>
  <circle class="pulse3" cx="256" cy="230" r="72" fill="none" stroke="#A89EE8" stroke-width="1"/>

  <!-- V ghost -->
  <polyline points="196,110 256,230 316,110" fill="none" stroke="#6B4FBB" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.2"/>

  <!-- Animated dashes left arm -->
  <polyline class="dash-l" points="256,230 196,110" fill="none" stroke="#6B4FBB" stroke-width="3.5" stroke-dasharray="8 6" stroke-dashoffset="120" stroke-linecap="round"/>
  <!-- Animated dashes right arm -->
  <polyline class="dash-r" points="256,230 316,110" fill="none" stroke="#8B6FDB" stroke-width="3.5" stroke-dasharray="8 6" stroke-dashoffset="120" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="256" cy="230" r="9" fill="#1E1252"/>
  <circle cx="256" cy="230" r="5" fill="#6B4FBB"/>

  <!-- Arm end dots -->
  <circle cx="196" cy="110" r="7" fill="#6B4FBB"/>
  <circle cx="316" cy="110" r="7" fill="#6B4FBB"/>

  <!-- Accent dots -->
  <circle cx="226" cy="174" r="3.5" fill="#A89EE8" opacity="0.7"/>
  <circle cx="286" cy="174" r="3.5" fill="#A89EE8" opacity="0.7"/>

  <!-- Divider -->
  <circle cx="156" cy="272" r="4" fill="#C4B8F0" opacity="0.5"/>
  <line x1="164" y1="272" x2="348" y2="272" stroke="#C4B8F0" stroke-width="1" opacity="0.4"/>
  <circle cx="356" cy="272" r="4" fill="#C4B8F0" opacity="0.5"/>

  <!-- Wordmark -->
  <text x="256" y="356" text-anchor="middle"><tspan class="wm-v">V</tspan><tspan class="wm">INCULA</tspan></text>

  <!-- Tagline -->
  <text x="256" y="390" text-anchor="middle" class="tag">educación · comunidad · conexión</text>
</svg>
