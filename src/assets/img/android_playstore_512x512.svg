  <polyline class="dl" points="256.0,317.44 112.63999999999999,81.92" fill="none" stroke="#7B5EA7" stroke-width="19.456" stroke-dasharray="28.16 19.456" stroke-dashoffset="317.44" stroke-linecap="round"/>
  <polyline class="dr" points="256.0,317.44 399.36,81.92" fill="none" stroke="#9B7FDB" stroke-width="19.456" stroke-dasharray="28.16 19.456" stroke-dashoffset="317.44" stroke-linecap="round"/>
